[package]
name = "starve-not"
version = "0.1.0-alpha.5"
edition = "2024"
authors = ["Louis <836250617@qq.com>"]
license = "MIT OR Apache-2.0"
description = "Adaptive admission control for multi-stage pipelines: keep the bottleneck fed while bounding work in flight"
repository = "https://github.com/kingwingfly/starve-not"
documentation = "https://docs.rs/starve-not"
readme = "README.md"
keywords = ["concurrency", "backpressure", "pipeline", "semaphore", "admission"]
categories = ["concurrency", "asynchronous"]

[features]
default = ["rt"]
## Spawn the pacer on a tokio runtime (`Pacer::spawn`).
rt = ["tokio/rt", "tokio/time"]
## Let policies explain their decisions (`Policy::diagnostics`).
diagnostics = []
## For tests: probes read the clock of the tokio runtime they were created in, so they follow
## `tokio::time::pause` like a spawned pacer.
test-util = ["rt", "tokio/test-util"]

[dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
parking_lot = "0.12"
smallvec = "1"
bon = "3.10.2"

[[example]]
name = "pipeline"
required-features = ["rt", "diagnostics"]

[dev-dependencies]
# turns on `diagnostics` for tests and examples, so a plain `cargo test` runs the simulations,
# which read it; dropped when publishing. Not `test-util`, so tests run the probes' normal clock:
# the paused-clock tests need `cargo test --features test-util` (or `--all-features`)
starve-not = { path = ".", default-features = false, features = ["diagnostics"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[package.metadata.docs.rs]
all-features = true
